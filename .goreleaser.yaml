version: 2
project_name: aerolatch

builds:
  - id: aerolatch
    main: .
    binary: aerolatch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - ids: [aerolatch]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - aerolatch-tui.png
      - aerolatch-nearby-tui.png
      - docs/*.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git
  sort: asc

release:
  github:
    owner: loxley
    name: aerolatch
  prerelease: auto
  make_latest: '{{ if .Prerelease }}false{{ else }}true{{ end }}'
  name_template: 'Aerolatch {{ .Tag }}'
